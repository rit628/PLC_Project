name: Test Suite

on:
  push:
    branches:
      - "*"
      - '*/*'
      - '**'
      - '!main'
  pull_request:
    branches:
      - "*"
      - '*/*'
      - '**'


jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '21'
          distribution: 'oracle'
    
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
    
      - name: Run Tests
        run: gradle test
    
      - name: Report Test Results
        uses: dorny/test-reporter@v1.8.0
        if: always()
        with:
            name: Test Results
            path: '**/build/test-results/test/TEST-*.xml'
            reporter: java-junit
            fail-on-error: true

permissions:
  id-token: write
  contents: read
  checks: write
  